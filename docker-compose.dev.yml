services:
  ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/restovoice
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_PHONE_NUMBER_ID=${VAPI_PHONE_NUMBER_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEBHOOK_URL=http://localhost:8000/v1/vapi/webhooks/vapi
      - AZURE_API_BASE=${AZURE_API_BASE}
      - AZURE_API_MODEL=${AZURE_API_MODEL}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
      - AZURE_OPENAI_ENDPOINT_VAPI=${AZURE_OPENAI_ENDPOINT_VAPI}
      - AZURE_OPENAI_DEPLOYMENT_VAPI=${AZURE_OPENAI_DEPLOYMENT_VAPI}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - BROWSER_USE_API_KEY=${BROWSER_USE_API_KEY}
      - BROWSER_USE_CDP_URL=${BROWSER_USE_CDP_URL}
      - BROWSER_USE_CLOUD=${BROWSER_USE_CLOUD}
      - LOG_LEVEL=INFO
      - DEBUG=false
      - CHROME_BIN=/usr/bin/chromium
      - CHROME_DRIVER=/usr/bin/chromedriver
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - prisma_cache:/root/.cache/prisma-python
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=restovoice
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5439:5439"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restovoice"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  prisma_cache:
