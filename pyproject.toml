[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restovoice_ai_backend"]

[project]
name = "ai-backend"
version = "0.1.0"
description = "AI voice reservation agent backend"
authors = [
    {name = "RestoVoice Team", email = "team@restovoice.com"}
]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.1.0",
    "pytest>=7.4.3",
    "httpx>=0.28.1",
    "openai>=2.21.0",
    "python-dotenv>=1.2.1",
    "langgraph>=1.0.8",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.9",
    "prisma>=0.13.1",
    "vapi-server-sdk>=1.9.0",
    "browser-use>=0.1.0",
    "browser-use-sdk>=0.1.0",
    "google>=3.0.0",
    "google-genai>=1.4.0",
    "google-generativeai>=0.8.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "cerebras>=0.0.1",
    "groq>=1.1.1",
]
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.21.1",
    "httpx==0.28.1",
    "black==23.11.0",
    "mypy==1.7.1",
]
prod = [
    "gunicorn==21.2.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "asyncio: Async tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_no_return = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "selenium.*",
    "playwright.*",
    "speech_recognition.*",
    "pyttsx3.*",
    "pyaudio.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    ".venv",
    ".eggs",
    "*.egg",
]

[tool.prisma]
binary_cache_dir = ".prisma-binaries"